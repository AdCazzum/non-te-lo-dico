<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="96" fill="#0f0f0f"/>
  
  <!-- Vault icon in yellow -->
  <g transform="translate(106, 106) scale(1.17)">
    <!-- Main vault body -->
    <rect x="32" y="64" width="192" height="192" rx="16" fill="#f5c842" stroke="#1a1a1a" stroke-width="8"/>
    
    <!-- Vault door circle -->
    <circle cx="128" cy="160" r="64" fill="#1a1a1a" stroke="#f5c842" stroke-width="6"/>
    
    <!-- Inner circle detail -->
    <circle cx="128" cy="160" r="48" fill="#f5c842" stroke="#1a1a1a" stroke-width="4"/>
    
    <!-- Center lock -->
    <circle cx="128" cy="160" r="16" fill="#1a1a1a"/>
    
    <!-- Handle -->
    <line x1="192" y1="160" x2="224" y2="160" stroke="#f5c842" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Bolts -->
    <circle cx="64" cy="96" r="8" fill="#1a1a1a"/>
    <circle cx="192" cy="96" r="8" fill="#1a1a1a"/>
    <circle cx="64" cy="224" r="8" fill="#1a1a1a"/>
    <circle cx="192" cy="224" r="8" fill="#1a1a1a"/>
  </g>
</svg>
